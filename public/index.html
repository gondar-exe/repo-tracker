<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Release Watcher</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 0 auto; padding: 1rem; line-height: 1.4; }
  textarea { width: 100%; box-sizing: border-box; padding: .6rem; font: inherit; margin: .3rem 0; height: 110px; }
  input { width: 100%; box-sizing: border-box; padding: .6rem; font: inherit; margin: .3rem 0; }
  button { padding: .55rem 1rem; font: inherit; cursor: pointer; margin: .2rem .2rem .2rem 0; }
  ul { list-style: none; padding: 0; }
  li { display: flex; justify-content: space-between; align-items: center; gap: .5rem; padding: .5rem 0; border-bottom: 1px solid #8884; }
  .sub { font-size: .8rem; opacity: .7; }
  #status { min-height: 1.4rem; margin: .6rem 0; }
  details { margin-top: 1.5rem; }
  code { word-break: break-all; }
</style>
</head>
<body>
  <h1>Release Watcher</h1>
  <p>Get a push notification when a GitHub repo publishes a new release.</p>

  <div id="status"></div>
  <button id="enable">Enable notifications</button>
  <button id="test">Send test notification</button>

  <h2>Add repos <span class="sub" id="count"></span></h2>
  <textarea id="input" placeholder="One per line, or separated by spaces/commas&#10;owner/repo or https://github.com/owner/repo"></textarea>
  <button id="add">Add</button>

  <ul id="list"></ul>

  <details>
    <summary>Backup / restore</summary>
    <p>Your recovery code. Save it somewhere. If you clear site data, paste it back to restore your list.</p>
    <p><code id="code"></code></p>
    <input id="restore" placeholder="Paste a recovery code to restore">
    <button id="restoreBtn">Restore</button>
  </details>

<script>
const $ = (id) => document.getElementById(id);
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

let deviceId = localStorage.getItem("deviceId");
if (!deviceId) {
  deviceId = crypto.randomUUID();
  localStorage.setItem("deviceId", deviceId);
}
let cfg = { maxRepos: 30 };

function setStatus(t) { $("status").textContent = t; }

async function api(path, method = "GET", body) {
  const opts = { method, headers: {} };
  if (body) { opts.headers["content-type"] = "application/json"; opts.body = JSON.stringify(body); }
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, data };
}

function b64ToU8(s) {
  const pad = "=".repeat((4 - (s.length % 4)) % 4);
  const raw = atob((s + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}

function supported() {
  return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
}

// Registers the service worker, gets (or creates) the push subscription, saves it on the server.
async function subscribeAndSave() {
  const reg = await navigator.serviceWorker.register("/sw.js");
  await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: b64ToU8(cfg.vapidPublicKey),
    });
  }
  return api("/api/subscribe", "POST", { deviceId, subscription: sub.toJSON() });
}

async function enable() {
  if (!supported()) {
    setStatus("This browser can't do push notifications. Open this page in Chrome (not an in-app browser).");
    return;
  }
  const perm = await Notification.requestPermission();
  if (perm !== "granted") {
    setStatus("Notifications are blocked. Allow them in your browser's site settings, then try again.");
    return;
  }
  const r = await subscribeAndSave();
  if (!r.ok) { setStatus("Error: " + (r.data.error || r.status)); return; }
  setStatus("Notifications enabled.");
  await loadRepos();
}

async function loadRepos() {
  const r = await api(`/api/repos?deviceId=${deviceId}`);
  if (!r.ok) { setStatus("Error loading list."); return; }
  if (!r.data.subscribed) setStatus("Tap \"Enable notifications\" to start.");
  render(r.data.repos || []);
}

function render(repos) {
  const ul = $("list");
  ul.textContent = "";
  $("count").textContent = `(${repos.length}/${cfg.maxRepos})`;
  for (const r of repos) {
    const li = document.createElement("li");
    const left = document.createElement("div");
    const a = document.createElement("a");
    a.href = `https://github.com/${r.name}/releases`;
    a.textContent = r.name;
    a.target = "_blank";
    a.rel = "noopener";
    const s = document.createElement("div");
    s.className = "sub";
    s.textContent = r.lastTitle ? `latest: ${r.lastTitle}` : "no releases yet";
    left.append(a, s);
    const b = document.createElement("button");
    b.textContent = "Remove";
    b.onclick = () => removeRepo(r.name);
    li.append(left, b);
    ul.append(li);
  }
}

async function addRepos() {
  const repos = $("input").value.split(/[\s,]+/).filter(Boolean);
  if (!repos.length) return;
  setStatus("Adding...");
  const r = await api("/api/repos", "POST", { deviceId, repos });
  if (!r.ok) { setStatus("Error: " + (r.data.error || r.status)); return; }
  const failed = r.data.failed || [];
  setStatus(
    `Added ${r.data.added.length}.` +
    (failed.length ? " Skipped: " + failed.map((f) => `${f.input} (${f.reason})`).join(", ") : "")
  );
  $("input").value = "";
  render(r.data.repos);
}

async function removeRepo(name) {
  const r = await api("/api/repos", "DELETE", { deviceId, repo: name });
  if (r.ok) render(r.data.repos);
}

async function sendTest() {
  const r = await api("/api/test", "POST", { deviceId });
  setStatus(r.ok && r.data.ok ? "Test sent. It should appear in a few seconds." : "Test failed. Try \"Enable notifications\" again.");
}

function restore() {
  const code = $("restore").value.trim();
  if (!UUID_RE.test(code)) { setStatus("That doesn't look like a recovery code."); return; }
  localStorage.setItem("deviceId", code);
  location.reload();
}

$("enable").onclick = enable;
$("test").onclick = sendTest;
$("add").onclick = addRepos;
$("restoreBtn").onclick = restore;

(async () => {
  $("code").textContent = deviceId;
  const c = await api("/api/config");
  if (c.ok) cfg = c.data;
  if (supported() && Notification.permission === "granted") {
    await subscribeAndSave(); // silently re-sync, so a restored device gets its new subscription
  }
  await loadRepos();
})();
</script>
</body>
</html>
