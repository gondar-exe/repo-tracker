name: check-releases

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may delay or skip runs; 5-10 min is typical
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-releases
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run check
        run: node check.mjs
        env:
          LIST_URL: ${{ secrets.LIST_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # built in, only used if USE_API=1
          USE_API: "0"                                 # set "1" for 50+ repos
      - name: Commit state
        run: |
          git config user.name "release-watcher"
          git config user.email "release-watcher@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
